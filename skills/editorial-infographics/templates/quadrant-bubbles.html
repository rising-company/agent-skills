<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadrant Bubbles</title>
<style>
  :root {
    --bg: #fafaf7; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dc; --q: #f0efe9;
    --c1: #4e8fb3; --c2: #d98c2b; --c3: #8aa05a; --c4: #b56b8f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --ink: #f1f0ea; --muted: #a3a29b; --line: #34332f; --q: #1f1f1c;
      --c1: #5fa3c8; --c2: #e39a3c; --c3: #9cb36a; --c4: #c77fa2;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: clamp(28px, 6vw, 48px); line-height: 1.05; margin: 0 0 6px; letter-spacing: -.02em; }
  .sub { font-size: 18px; color: var(--muted); margin: 0 0 14px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  .controls button { font: inherit; padding: 4px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .controls button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .key { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin: 0 0 8px; }
  .key span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    margin-right: 6px; background: var(--sw); }
  .quad { fill: var(--q); }
  .qlbl { fill: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .axis text { fill: var(--muted); font-size: 11px; }
  .axis path, .axis line { stroke: var(--line); }
  .atitle { fill: var(--ink); font-size: 12px; font-weight: 600; }
  circle.b { stroke: var(--bg); stroke-width: 1.5; fill-opacity: .85; }
  text.bl { fill: var(--ink); font-size: 11px; pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
  text.ann { fill: var(--ink); font-size: 12px; font-style: italic; }
  .tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 9px;
    border-radius: 4px; font-size: 13px; max-width: 280px; opacity: 0; }
  footer { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1 id="headline"></h1>
  <p class="sub" id="subhead"></p>
  <div class="controls" id="controls"></div>
  <div class="key" id="key"></div>
  <div id="chart" role="img"></div>
  <footer id="footer"></footer>
</main>
<div class="tip" id="tip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
// ===== COPY =====
const COPY = {
  headline: "Sample-o-Scope",
  subhead: "Placeholder data — two measures that trade off; the corners tell the story.",
  sizeMeans: "Bubble size = scale (e.g. cases per year)",
  sources: "SAMPLE DATA, not real figures",
  dataUrl: "data.csv",
  credits: "Design: you",
  updated: "Jan 2026",
};
// Alternative x metrics → toggle buttons. `threshold` draws the vertical quadrant line.
const X_METRICS = {
  spread: { label: "Spread (R0)", field: "spread", log: false, threshold: 1 },
  speed:  { label: "Spread (alt. metric)", field: "speed", log: true, threshold: 7 },
};
const Y = { label: "Fatality rate (%)", field: "fatality", log: true, threshold: 1, max: 100 };
// Quadrant labels: [top-left, top-right, bottom-left, bottom-right]
const QUADRANTS = ["Deadly, contained", "Deadly & spreading", "Mild, contained", "Mild but everywhere"];
const CATEGORIES = { virus: ["Virus", "--c1"], bacteria: ["Bacteria", "--c2"], parasite: ["Parasite", "--c3"], other: ["Other", "--c4"] };
// ===== DATA (`ann` adds an on-chart annotation) =====
const DATA = [
  { label: "Sample A", spread: 15,  speed: 12, fatality: 0.2, size: 900, cat: "virus", ann: "spreads fastest" },
  { label: "Sample B", spread: 1.8, speed: 9,  fatality: 50,  size: 30,  cat: "virus", ann: "rare but lethal" },
  { label: "Sample C", spread: 1.3, speed: 2,  fatality: 0.1, size: 1200, cat: "virus" },
  { label: "Sample D", spread: 3,   speed: 5,  fatality: 2,   size: 400, cat: "virus" },
  { label: "Sample E", spread: 0.6, speed: 20, fatality: 12,  size: 80,  cat: "bacteria" },
  { label: "Sample F", spread: 2.2, speed: 3,  fatality: 0.5, size: 250, cat: "bacteria" },
  { label: "Sample G", spread: 0.9, speed: 14, fatality: 25,  size: 60,  cat: "parasite" },
  { label: "Sample H", spread: 5,   speed: 6,  fatality: 4,   size: 150, cat: "virus" },
  { label: "Sample I", spread: 0.4, speed: 30, fatality: 70,  size: 5,   cat: "other" },
  { label: "Sample J", spread: 7,   speed: 1.5,fatality: 0.05,size: 600, cat: "bacteria" },
];
// ===== end of things to edit =====

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const tip = d3.select("#tip");
let xKey = Object.keys(X_METRICS)[0];

d3.select("#headline").text(COPY.headline);
d3.select("#subhead").text(COPY.subhead);
d3.select("#key").html(Object.values(CATEGORIES).map(c => `<span style="--sw:var(${c[1]})">${c[0]}</span>`).join("") + `<span style="--sw:transparent">${COPY.sizeMeans}</span>`);
d3.select("#footer").html(`Sources: ${COPY.sources} · <a href="${COPY.dataUrl}">See the data</a> · ${COPY.credits} · Updated ${COPY.updated}`);
d3.select("#chart").attr("aria-label", `${COPY.headline}: ` + DATA.map(d => d.label).join(", "));

const ctl = d3.select("#controls");
ctl.append("span").text("Across:");
ctl.selectAll("button").data(Object.entries(X_METRICS)).join("button").text(d => d[1].label)
  .attr("aria-pressed", d => String(d[0] === xKey))
  .on("click", (e, d) => { xKey = d[0]; ctl.selectAll("button").attr("aria-pressed", b => String(b[0] === xKey)); draw(); });

const scale = (m, vals, range) => {
  const ext = d3.extent([...vals, m.threshold]);
  const s = m.log ? d3.scaleLog().domain([ext[0] / 1.6, ext[1] * 1.6]).range(range).nice()
                  : d3.scaleLinear().domain([0, ext[1] * 1.1]).range(range).nice();
  if (m.max != null && s.domain()[1] > m.max) s.domain([s.domain()[0], m.max]); // e.g. % can't exceed 100
  return s;
};

function draw() {
  const el = document.getElementById("chart");
  const W = el.clientWidth, narrow = W < 600;
  const H = narrow ? 520 : 600, M = { t: 16, r: 16, b: 44, l: 52 };
  const xm = X_METRICS[xKey];
  const x = scale(xm, DATA.map(d => d[xm.field]), [M.l, W - M.r]);
  const y = scale(Y, DATA.map(d => d[Y.field]), [H - M.b, M.t]);
  const r = d3.scaleSqrt().domain([0, d3.max(DATA, d => d.size)]).range([3, narrow ? 28 : 42]);
  const tx = x(xm.threshold), ty = y(Y.threshold);

  d3.select(el).selectAll("svg").remove();
  const svg = d3.select(el).append("svg").attr("viewBox", [0, 0, W, H]).attr("width", W).attr("height", H);

  // Shade the "worst" quadrant (top-right) and label all four
  svg.append("rect").attr("class", "quad").attr("x", tx).attr("y", M.t).attr("width", W - M.r - tx).attr("height", ty - M.t);
  // On narrow screens stagger the right-hand labels so the pairs never collide
  const st = narrow ? 15 : 0;
  const ql = [[M.l + 8, M.t + 16, "start"], [W - M.r - 8, M.t + 16 + st, "end"], [M.l + 8, H - M.b - 10 - st, "start"], [W - M.r - 8, H - M.b - 10, "end"]];
  svg.selectAll("text.qlbl").data(QUADRANTS).join("text").attr("class", "qlbl")
    .attr("x", (d, i) => ql[i][0]).attr("y", (d, i) => ql[i][1]).attr("text-anchor", (d, i) => ql[i][2])
    .attr("font-size", narrow ? 10 : 13).text(d => d);
  svg.append("line").attr("x1", tx).attr("x2", tx).attr("y1", M.t).attr("y2", H - M.b).attr("stroke", css("--muted")).attr("stroke-dasharray", "4 4");
  svg.append("line").attr("x1", M.l).attr("x2", W - M.r).attr("y1", ty).attr("y2", ty).attr("stroke", css("--muted")).attr("stroke-dasharray", "4 4");

  const tf = d3.format("~g");
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - M.b})`).call(d3.axisBottom(x).ticks(narrow ? 4 : 8, tf));
  svg.append("g").attr("class", "axis").attr("transform", `translate(${M.l},0)`).call(d3.axisLeft(y).ticks(6, tf));
  svg.append("text").attr("class", "atitle").attr("x", W - M.r).attr("y", H - 8).attr("text-anchor", "end").text(`${xm.label} →`);
  svg.append("text").attr("class", "atitle").attr("transform", `translate(14,${M.t}) rotate(-90)`).attr("text-anchor", "end").text(`${Y.label} →`);

  const data = [...DATA].sort((a, b) => b.size - a.size); // big first so small bubbles stay on top
  svg.append("g").selectAll("circle").data(data).join("circle").attr("class", "b")
    .attr("cx", d => x(d[xm.field])).attr("cy", d => y(d[Y.field])).attr("r", d => r(d.size))
    .attr("fill", d => css(CATEGORIES[d.cat][1]))
    .on("mousemove", (e, d) => tip.style("opacity", 1).style("left", e.clientX + 12 + "px").style("top", e.clientY + 12 + "px")
      .html(`<b>${d.label}</b><br>${xm.label}: ${d[xm.field]}<br>${Y.label}: ${d[Y.field]}<br>Size: ${d.size}`))
    .on("mouseleave", () => tip.style("opacity", 0));
  // Labels sit right of the bubble, flipping left when they would run off the edge
  const flip = d => x(d[xm.field]) > W - M.r - 90;
  const lx = d => flip(d) ? x(d[xm.field]) - r(d.size) - 3 : x(d[xm.field]) + r(d.size) + 3;
  svg.append("g").selectAll("text").data(data).join("text").attr("class", "bl")
    .attr("x", lx).attr("y", d => y(d[Y.field])).attr("dy", ".35em")
    .attr("text-anchor", d => flip(d) ? "end" : "start").text(d => d.label);
  svg.append("g").selectAll("text").data(data.filter(d => d.ann)).join("text").attr("class", "ann")
    .attr("x", lx).attr("y", d => y(d[Y.field]) + 15)
    .attr("text-anchor", d => flip(d) ? "end" : "start").text(d => d.ann);
}

draw();
addEventListener("resize", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
</script>
</body>
</html>
